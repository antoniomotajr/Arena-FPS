<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Sunset Racing</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05010a; font-family:'Segoe UI', Arial, sans-serif; color:#fff; user-select:none; }
  canvas { display:block; }
  #app { position:fixed; inset:0; }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  .panel { position:absolute; padding:10px 14px; border-radius:12px; background:rgba(10,5,25,0.6); border:1px solid rgba(0,255,255,0.3); backdrop-filter:blur(8px); text-shadow:0 0 8px #00ffff; }
  #hud-tl { top:16px; left:16px; font-size:13px; line-height:1.6; }
  #hud-tl .lbl { color:#7ff; font-size:10px; letter-spacing:2px; }
  #hud-tl .val { font-size:18px; font-weight:700; }
  #hud-tr { top:16px; right:16px; text-align:right; font-size:13px; line-height:1.6; }
  #hud-tr .lbl { color:#f7a; font-size:10px; letter-spacing:2px; }
  #hud-tr .val { font-size:18px; font-weight:700; }
  
  #speedo { position:absolute; top:16px; left:50%; transform:translateX(-50%); width:130px; height:130px; border-radius:50%; background:radial-gradient(circle, rgba(0,0,0,0.7) 0%, rgba(30,5,55,0.9) 100%); border:3px solid rgba(0,255,255,0.4); box-shadow:0 0 30px rgba(0,255,255,0.4); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #speed-num { font-size:38px; font-weight:900; color:#00ffff; line-height:1; }
  #speed-unit { font-size:10px; color:#ffaa00; letter-spacing:2px; }
  
  /* HUD de Controles (Canto Inferior Esquerdo) */
  #controls-hint {
    position:absolute; bottom:20px; left:20px;
    display:flex; flex-direction:column; gap:8px;
    opacity:0.6; transition:opacity 0.3s;
  }
  #controls-hint:hover { opacity:1; }
  .ctrl-row { display:flex; gap:6px; align-items:center; }
  .key {
    width:32px; height:32px; border-radius:6px;
    background:rgba(10,5,25,0.6); border:1.5px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:#fff;
    text-shadow:0 0 5px #000; transition:all 0.1s;
  }
  .key.active {
    background:rgba(0,255,255,0.8); border-color:#00ffff; color:#000;
    box-shadow:0 0 15px #00ffff; transform:scale(1.1);
  }
  .key.wide { width:80px; font-size:10px; letter-spacing:1px; }
  .ctrl-label { font-size:10px; color:#aaa; letter-spacing:1px; margin-left:6px; }

  #bars { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); width:min(340px, 70vw); display:flex; flex-direction:column; gap:8px; }
  .bar-wrap { height:12px; background:rgba(0,0,0,0.6); border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; overflow:hidden; position:relative; }
  .bar-wrap .fill { height:100%; width:100%; transition:width 0.1s; }
  #nitro-fill { background:linear-gradient(90deg, #00bfff, #00ffff); }
  #hp-fill { background:linear-gradient(90deg, #ff4444, #44ff88); }
  .bar-lbl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; letter-spacing:2px; font-weight:700; text-shadow:0 0 5px #000; }

  /* Top Buttons */
  #top-actions { position:absolute; top:16px; left:50%; transform:translateX(-50%); margin-top:160px; display:flex; gap:10px; pointer-events:auto; z-index:20; }
  .icon-btn { width:44px; height:44px; border-radius:12px; background:rgba(10,5,25,0.6); border:1.5px solid rgba(0,255,255,0.4); color:#00ffff; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(6px); }
  .icon-btn:active { background:rgba(0,255,255,0.4); }

  /* Controles Mobile */
  .ctrl { position:absolute; bottom:80px; pointer-events:auto; display:flex; gap:12px; z-index:20; }
  #ctrl-left { left:18px; }
  #ctrl-right { right:18px; flex-direction:column; }
  .btn { width:70px; height:70px; border-radius:50%; background:rgba(10,5,25,0.6); border:2px solid rgba(0,255,255,0.6); color:#00ffff; font-size:22px; font-weight:700; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); cursor:pointer; transition:transform 0.1s, background 0.1s; }
  .btn:active, .btn.on { background:rgba(0,255,255,0.4); transform:scale(0.92); }
  .btn.brake { border-color:#ff3366; color:#ff3366; font-size:14px; }
  .btn.nitro { border-color:#ffaa00; color:#ffaa00; font-size:13px; width:80px; height:80px; }

  /* Esconde controles virtuais no Desktop */
  @media (min-width: 900px) {
    .ctrl { display: none; }
  }
  /* Esconde o teclado virtual no Mobile */
  @media (max-width: 899px) {
    #controls-hint { display: none; }
  }

  /* Dano */
  #damage-overlay { position:fixed; inset:0; background:rgba(255,0,0,0.4); opacity:0; pointer-events:none; z-index:50; transition:opacity 0.1s; }

  /* Menus */
  .overlay { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(5,1,10,0.9); backdrop-filter:blur(10px); transition:opacity 0.4s; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .menu-box { width:min(400px, 90vw); padding:30px; border-radius:20px; background:rgba(15,5,35,0.8); border:1.5px solid rgba(0,255,255,0.4); box-shadow:0 0 50px rgba(0,255,255,0.3); text-align:center; }
  .title { font-size:32px; font-weight:900; margin-bottom:20px; background:linear-gradient(90deg, #00ffff, #ff00cc); -webkit-background-clip:text; color:transparent; }
  .start-btn { width:100%; padding:16px; font-size:16px; font-weight:800; border-radius:12px; border:none; cursor:pointer; background:linear-gradient(90deg, #00ffff, #00bfff); color:#05010a; box-shadow:0 0 20px rgba(0,255,255,0.5); }
  .start-btn:active { transform:scale(0.97); }
</style>
</head>
<body>
<div id="app"></div>
<div id="damage-overlay"></div>

<div id="hud">
  <div id="hud-tl" class="panel">
    <div class="lbl">DISTÂNCIA</div><div class="val" id="dist-val">0 m</div>
  </div>
  <div id="speedo">
    <div id="speed-num">0</div><div id="speed-unit">KM/H</div>
  </div>
  <div id="hud-tr" class="panel">
    <div class="lbl">PONTOS</div><div class="val" id="score-val" style="color:#ffcc00;">0</div>
  </div>
  
  <div id="top-actions">
    <div class="icon-btn" id="btn-camera" title="Alternar Câmera">📷</div>
  </div>

  <!-- HUD de Controles (Desktop) -->
  <div id="controls-hint">
    <div class="ctrl-row">
      <div class="key" id="key-a">A</div>
      <div class="key" id="key-w">W</div>
      <div class="key" id="key-d">D</div>
      <div class="ctrl-label">DIRIGIR</div>
    </div>
    <div class="ctrl-row">
      <div class="key" id="key-s">S</div>
      <div class="ctrl-label">FREIO</div>
    </div>
    <div class="ctrl-row">
      <div class="key wide" id="key-space">ESPAÇO</div>
      <div class="ctrl-label">NITRO</div>
    </div>
    <div class="ctrl-row">
      <div class="key" id="key-c">C</div>
      <div class="ctrl-label">CÂMERA</div>
    </div>
  </div>

  <div id="bars">
    <div class="bar-wrap"><div class="fill" id="hp-fill"></div><div class="bar-lbl">INTEGRIDADE</div></div>
    <div class="bar-wrap"><div class="fill" id="nitro-fill"></div><div class="bar-lbl">NITRO</div></div>
  </div>
  
  <div class="ctrl" id="ctrl-left">
    <div class="btn" id="btn-left">◀</div><div class="btn" id="btn-right">▶</div>
  </div>
  <div class="ctrl" id="ctrl-right">
    <div class="btn nitro" id="btn-nitro">NITRO</div><div class="btn brake" id="btn-brake">FREIO</div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="menu-box">
    <div class="title">CYBER SUNSET</div>
    <button class="start-btn" id="btn-start">INICIAR CORRIDA</button>
  </div>
</div>

<div class="overlay hidden" id="gameover">
  <div class="menu-box">
    <div class="title" style="color:#ff3366;">BATEU!</div>
    <div style="font-size:14px; margin:20px 0;">Sua pontuação: <b id="go-score" style="color:#00ffff; font-size:20px;">0</b></div>
    <button class="start-btn" id="btn-restart">TENTAR NOVAMENTE</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const state = { running: false, score: 0, distance: 0, speed: 0, hp: 100, nitro: 100, shake: 0, cameraMode: 0 };
const keys = { left: false, right: false, down: false, nitro: false };

class Game {
  constructor() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    document.getElementById('app').appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x1a0033);
    this.scene.fog = new THREE.FogExp2(0x1a0033, 0.015);

    this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 300);
    this.cameraModes = [
      { pos: new THREE.Vector3(0, 5, 10), look: new THREE.Vector3(0, 0, -20), fov: 65 }, 
      { pos: new THREE.Vector3(0, 9, 14), look: new THREE.Vector3(0, 0, -30), fov: 70 }, 
      { pos: new THREE.Vector3(0, 1.3, -0.2), look: new THREE.Vector3(0, 1.0, -20), fov: 80 } 
    ];
    this.camera.position.copy(this.cameraModes[0].pos);
    this.camera.lookAt(this.cameraModes[0].look);

    this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 20, 0);
    dirLight.castShadow = true;
    this.scene.add(dirLight);

    // Pista
    const roadGeo = new THREE.PlaneGeometry(30, 150);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9 });
    this.road = new THREE.Mesh(roadGeo, roadMat);
    this.road.rotation.x = -Math.PI / 2;
    this.road.position.set(0, 0, -50);
    this.road.receiveShadow = true;
    this.scene.add(this.road);

    const sideGeo = new THREE.PlaneGeometry(100, 150);
    const sideMat = new THREE.MeshStandardMaterial({ color: 0x0a0018 });
    const leftSide = new THREE.Mesh(sideGeo, sideMat);
    leftSide.rotation.x = -Math.PI / 2;
    leftSide.position.set(-65, -0.1, -50);
    this.scene.add(leftSide);
    const rightSide = leftSide.clone();
    rightSide.position.x = 65;
    this.scene.add(rightSide);

    const leftEdge = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 150), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
    leftEdge.rotation.x = -Math.PI / 2;
    leftEdge.position.set(-10, 0.01, -50);
    this.scene.add(leftEdge);
    const rightEdge = leftEdge.clone();
    rightEdge.material = new THREE.MeshBasicMaterial({ color: 0xff00cc });
    rightEdge.position.x = 10;
    this.scene.add(rightEdge);

    this.player = this.createCar(0xffcc00);
    this.player.position.set(0, 0, 0);
    this.scene.add(this.player);

    this.obstacles = [];
    this.coins = [];
    this.laneLines = [];

    for(let i=0; i<20; i++) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.01, -i * 8);
      this.scene.add(line);
      this.laneLines.push(line);
    }

    this.speedLines = [];
    for(let i=0; i<15; i++) {
      const geo = new THREE.PlaneGeometry(0.1, 2);
      const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
      const line = new THREE.Mesh(geo, mat);
      line.position.set((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 15 + 5), Math.random() * 2 + 0.5, -Math.random() * 80);
      line.rotation.x = -Math.PI / 2;
      line.rotation.z = Math.PI / 2;
      this.scene.add(line);
      this.speedLines.push(line);
    }

    this.clock = new THREE.Clock();
    this.spawnTimer = 0;
    this.particles = [];

    window.addEventListener('resize', () => this.resize());
    this.renderer.setAnimationLoop(() => this.loop());
  }

  createCar(color) {
    const g = new THREE.Group();
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 5), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6 }));
    shadow.rotation.x = -Math.PI/2;
    shadow.position.y = 0.01;
    g.add(shadow);

    const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 4.2), new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.2 }));
    body.position.y = 0.5;
    body.castShadow = true;
    g.add(body);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    cabin.position.set(0, 1.05, 0.2);
    g.add(cabin);
    g.userData.cabin = cabin;

    const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
    const positions = [[-0.95, 0.35, -1.4], [0.95, 0.35, -1.4], [-0.95, 0.35, 1.4], [0.95, 0.35, 1.4]];
    positions.forEach(p => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(...p);
      g.add(w);
    });

    const tail = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0x880000 }));
    tail.position.set(0, 0.6, 2.1);
    g.add(tail);
    g.userData.tailLight = tail;

    return g;
  }

  spawnObstacle() {
    const o = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 1), new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0x551100 }));
    o.position.set((Math.random() - 0.5) * 14, 0.6, -120);
    o.castShadow = true;
    this.scene.add(o);
    this.obstacles.push(o);
  }

  spawnCoin() {
    const c = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.15, 8, 16), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    c.position.set((Math.random() - 0.5) * 14, 1, -120);
    this.scene.add(c);
    this.coins.push(c);
  }

  createExplosion(x, y, z) {
    for(let i=0; i<15; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xffaa00 : 0xff3300 }));
      p.position.set(x, y, z);
      p.userData.vel = new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10, (Math.random()-0.5)*10);
      p.userData.life = 0.6;
      this.scene.add(p);
      this.particles.push(p);
    }
  }

  triggerDamage() {
    const overlay = document.getElementById('damage-overlay');
    overlay.style.opacity = 1;
    setTimeout(() => overlay.style.opacity = 0, 150);
    state.shake = 0.5;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  }

  toggleCamera() {
    state.cameraMode = (state.cameraMode + 1) % 3;
    const mode = this.cameraModes[state.cameraMode];
    this.camera.fov = mode.fov;
    this.camera.updateProjectionMatrix();
    this.player.userData.cabin.visible = (state.cameraMode !== 2);
  }

  reset() {
    state.running = true;
    state.speed = 40;
    state.score = 0;
    state.distance = 0;
    state.hp = 100;
    state.nitro = 100;
    state.shake = 0;
    state.cameraMode = 0;
    this.player.position.x = 0;
    this.player.userData.cabin.visible = true;
    this.camera.fov = this.cameraModes[0].fov;
    this.camera.updateProjectionMatrix();
    
    this.obstacles.forEach(o => this.scene.remove(o));
    this.coins.forEach(c => this.scene.remove(c));
    this.obstacles = [];
    this.coins = [];
    this.particles.forEach(p => this.scene.remove(p));
    this.particles = [];

    const music = document.getElementById('bg-music');
    if (music) { music.currentTime = 0; music.play().catch(() => {}); }
  }

  loop() {
    const dt = Math.min(this.clock.getDelta(), 0.05);
    if (!state.running) return;

    if (keys.down) state.speed -= 40 * dt;
    else state.speed += 15 * dt;

    if (keys.nitro && state.nitro > 0) {
      state.nitro -= 30 * dt;
      state.speed += 40 * dt;
    } else {
      state.nitro = Math.min(100, state.nitro + 15 * dt);
    }
    
    state.speed = Math.max(10, Math.min(state.speed, 120));
    state.distance += state.speed * dt;
    const moveSpeed = state.speed * dt;

    if (keys.left) this.player.position.x -= 20 * dt;
    if (keys.right) this.player.position.x += 20 * dt;
    this.player.position.x = Math.max(-8, Math.min(this.player.position.x, 8));

    const targetRoll = keys.left ? 0.15 : (keys.right ? -0.15 : 0);
    this.player.rotation.z += (targetRoll - this.player.rotation.z) * dt * 10;
    
    if (this.player.userData.tailLight) {
      this.player.userData.tailLight.material.color.setHex(keys.down ? 0xff0000 : 0x880000);
    }

    const currentMode = this.cameraModes[state.cameraMode];
    let shakeX = 0, shakeY = 0;
    if (state.shake > 0) {
      state.shake -= dt * 2;
      shakeX = (Math.random() - 0.5) * state.shake;
      shakeY = (Math.random() - 0.5) * state.shake;
    }

    const targetCamPos = currentMode.pos.clone();
    if (state.cameraMode !== 2) {
      targetCamPos.x += this.player.position.x * (state.cameraMode === 0 ? 0.5 : 0.3);
    } else {
      targetCamPos.x += this.player.position.x;
    }

    this.camera.position.x += (targetCamPos.x - this.camera.position.x) * dt * 10 + shakeX;
    this.camera.position.y += (targetCamPos.y - this.camera.position.y) * dt * 10 + shakeY;
    this.camera.position.z = targetCamPos.z;
    
    const targetLook = currentMode.look.clone();
    if (state.cameraMode !== 2) targetLook.x += this.player.position.x * 0.8;
    else targetLook.x += this.player.position.x;
    
    this.camera.lookAt(targetLook.x, targetLook.y, targetLook.z);

    const baseFov = currentMode.fov;
    const targetFov = baseFov + (state.speed > 80 ? 10 : 0) + (keys.nitro && state.nitro > 0 ? 15 : 0);
    this.camera.fov += (targetFov - this.camera.fov) * dt * 5;
    this.camera.updateProjectionMatrix();

    this.laneLines.forEach(line => {
      line.position.z += moveSpeed;
      if (line.position.z > 10) line.position.z -= 160;
    });

    this.speedLines.forEach(line => {
      line.position.z += moveSpeed * 1.5;
      line.material.opacity = Math.min(0.8, state.speed / 100);
      if (line.position.z > 10) {
        line.position.z = -Math.random() * 80;
        line.position.x = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 15 + 5);
      }
    });

    this.spawnTimer += dt;
    if (this.spawnTimer > 0.5) {
      this.spawnTimer = 0;
      if (Math.random() > 0.2) this.spawnObstacle();
      if (Math.random() > 0.4) this.spawnCoin();
    }

    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const o = this.obstacles[i];
      o.position.z += moveSpeed;
      if (Math.abs(o.position.z - this.player.position.z) < 2.5 && Math.abs(o.position.x - this.player.position.x) < 2.0) {
        if (state.hp > 0) {
          state.hp -= 25; state.speed = 20;
          this.triggerDamage();
          this.createExplosion(o.position.x, o.position.y, o.position.z);
          this.scene.remove(o); this.obstacles.splice(i, 1);
          if (state.hp <= 0) this.gameOver();
          continue;
        }
      }
      if (o.position.z > 10) { this.scene.remove(o); this.obstacles.splice(i, 1); }
    }

    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i];
      c.position.z += moveSpeed; c.rotation.y += dt * 5;
      if (Math.abs(c.position.z - this.player.position.z) < 2.5 && Math.abs(c.position.x - this.player.position.x) < 2.0) {
        state.score += 50; state.nitro = Math.min(100, state.nitro + 10);
        this.scene.remove(c); this.coins.splice(i, 1);
        continue;
      }
      if (c.position.z > 10) { this.scene.remove(c); this.coins.splice(i, 1); }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.position.add(p.userData.vel.clone().multiplyScalar(dt));
      p.userData.life -= dt; p.material.opacity = p.userData.life;
      p.rotation.x += dt * 5; p.rotation.y += dt * 5;
      if (p.userData.life <= 0) { this.scene.remove(p); this.particles.splice(i, 1); }
    }

    document.getElementById('speed-num').innerText = Math.floor(state.speed * 2.5);
    document.getElementById('dist-val').innerText = Math.floor(state.distance) + ' m';
    document.getElementById('score-val').innerText = state.score;
    document.getElementById('hp-fill').style.width = state.hp + '%';
    document.getElementById('nitro-fill').style.width = state.nitro + '%';

    this.renderer.render(this.scene, this.camera);
  }

  gameOver() {
    state.running = false;
    const music = document.getElementById('bg-music');
    if (music) music.pause();
    document.getElementById('go-score').innerText = state.score;
    document.getElementById('gameover').classList.remove('hidden');
  }

  resize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }
}

const game = new Game();

// UI
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('menu').classList.add('hidden');
  game.reset();
});
document.getElementById('btn-restart').addEventListener('click', () => {
  document.getElementById('gameover').classList.add('hidden');
  game.reset();
});
document.getElementById('btn-camera').addEventListener('click', () => game.toggleCamera());

// Função para atualizar o visual das teclas no HUD
function updateKeyVisual(id, isPressed) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('active', isPressed);
}

// Teclado
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; updateKeyVisual('key-a', true); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; updateKeyVisual('key-d', true); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { keys.down = true; updateKeyVisual('key-s', true); }
  if (e.code === 'Space') { keys.nitro = true; updateKeyVisual('key-space', true); }
  if (e.code === 'KeyC') { 
    game.toggleCamera(); 
    updateKeyVisual('key-c', true);
    setTimeout(() => updateKeyVisual('key-c', false), 150);
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = false; updateKeyVisual('key-a', false); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = false; updateKeyVisual('key-d', false); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { keys.down = false; updateKeyVisual('key-s', false); }
  if (e.code === 'Space') { keys.nitro = false; updateKeyVisual('key-space', false); }
});

// Controles Touch
const bind = (id, key) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); });
  el.addEventListener('mousedown', e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); });
  el.addEventListener('mouseup', e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); });
};
bind('btn-left', 'left');
bind('btn-right', 'right');
bind('btn-brake', 'down');
bind('btn-nitro', 'nitro');
</script>

<audio id="bg-music" loop>
  <source src="corrida.mp3" type="audio/mpeg">
</audio>
